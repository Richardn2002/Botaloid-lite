[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "botaloid-lite"
version = "0.3.0"
description = "Quote real lyrics with translation, timestamp, title and author"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
fetch = ["requests>=2.32,<3"]

[tool.setuptools]
packages = ["botaloid_lite"]
license-files = ["LICENSE"]
